name: Production smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  smoke-tests:
    name: Check live production API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check application health
        run: |
          response=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 60 \
            https://taskflow-api-9g57.onrender.com/health)

          echo "$response" | jq -e '.status == "ok"'

      - name: Check database readiness
        run: |
          response=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 60 \
            https://taskflow-api-9g57.onrender.com/health/ready)

          echo "$response" | jq -e \
            '.status == "ready" and .database == "connected"'
